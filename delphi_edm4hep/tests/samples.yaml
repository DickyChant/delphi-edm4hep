# Samples for the conversion-identity test. One entry = one converted file,
# compared against a blessed reference held on lepdata-edm4hep.
#
# Inputs are addressed through fatfind and read from CERN Open Data:
# data-test.sh pins DELPHI_DATA_ROOT=/eos/opendata/delphi, so nicknames resolve
# tape -> collision-data and MCprod -> simulated-data.
#
# select.mode:
#   nickname  -> delphi_sdst_pass -N <value>   (fatfind dataset; data AND mc)
#   pdl       -> delphi_sdst_pass -P <value>   (pre-expanded PDL; escape hatch)
#   file      -> delphi_sdst_pass <value>      (explicit path)
#
# max_events: -1 = whole file, otherwise the -n cap.

samples:
  - id: data_94c_short
    kind: data
    period: 94c
    select: {mode: nickname, value: "short94_c2/c1-1"}
    max_events: -1
    note: "first file of short94_c2 -> collision-data/Y13709/Y13709.1.al"

  - id: mc_94c_qqps_ral
    kind: mc
    period: 94c
    select: {mode: nickname, value: "sh_qqps_r94_2l_c2/c1-1"}
    max_events: -1
    note: "ShortDST qqbar, sim of 94 (liq) ANA94C Fix2, RAL -> Y10060.346.al"

  - id: data_95d_long
    kind: data
    period: 95d
    select: {mode: nickname, value: "long95p3_d2/c1-1"}
    max_events: 2000
    note: "longDST -> Y13718.210.al. The only sample carrying MU, EL and TDHA, so
      the only cover for the lDST_* collections. Flavour verified by module
      inventory: catalogue prefixes do not track the DST flavour. Preferred over
      long96_e1, which carries neither b-tag (see README)."

  - id: data_99d_xshort
    kind: data
    period: 99d
    select: {mode: nickname, value: "xsdst99_d1/c1-1"}
    max_events: 2000
    note: "extended shortDST -> R02140.1.al. Covers TE/TERF/TEST/TEVF, TOF, TDID,
      STIC, MRIC, HCRO, HCMU and PXTD, none of which the LEP1 samples reach."

  - id: mc_a0e_xshort
    kind: mc
    period: a0e
    select: {mode: nickname, value: "xs_apacic105_207_wupp_a0e1/c1-1"}
    max_events: 2000
    note: "extended shortDST simulation at 206.5 GeV."

# A DELPHI DST comes in three flavours and the module inventory follows the
# flavour, not the year or the processing tag, so the samples cover all three.
# No longDST simulation was found: every lo_* MC nickname checked (lo_92e2,
# lo_93d2, lo_94c, lo_95d2, lo_qqps_z0_cern_94c2) carries the bare shortDST
# inventory, and the four long* entries are all data.

# Cross-check of the INPUT MODES, not of the conversion. Converts one physical
# file two ways in the same run and requires the two results to agree.
equivalence:
  - id: fatfind_nickname_vs_file
    a: {mode: nickname, value: "short94_c2/c1-1"}
    b: {mode: file, value: "/eos/opendata/delphi/collision-data/Y13709/Y13709.1.al"}
    max_events: -1
